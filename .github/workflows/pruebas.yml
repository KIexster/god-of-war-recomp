# Comprobaciones que no necesitan el juego: pruebas de src/, parches sobre PS2Recomp y suite del runtime.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overrides:
    name: Comprobaciones rapidas (config, scripts y src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar config/funcmap.csv y config/recomp.template.toml
        run: python3 tools/ci/validar_config.py
      - name: Probar el inspector de paquetes GIF
        run: python3 -m unittest discover -s tests -p test_gif_inspector.py
      - name: Probar la seleccion de cadenas VIF
        run: python3 -m unittest discover -s tests -p test_vif_chain_extractor.py
      - name: Probar la seleccion de ventanas de rendimiento
        run: python3 -m unittest discover -s tests -p test_perf_summary.py
      - name: Probar la lectura de referencia PCSX2 sin el juego
        run: python3 -m unittest discover -s tests -p test_pcsx2_ee_reference.py
      - name: Probar el inspector de imágenes compartidas
        run: python3 -m unittest discover -s tests -p test_shared_frames.py
      - name: Probar el control privado de transición sin el juego
        run: python3 -m unittest discover -s tests -p test_transition_control.py
      - name: Analizar los scripts de PowerShell
        shell: pwsh
        run: ./tools/ci/analizar_ps1.ps1
      - name: Probar la vigilancia del perfil de rendimiento
        shell: pwsh
        run: ./tests/perf_guard_test.ps1
      - name: Compilar y ejecutar tests/pad2_packet_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pad2_packet_test.cpp -o pad2_packet_test
          ./pad2_packet_test
      - name: Probar guion digital, stick y duraciones sin el juego
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pad_script_test.cpp -o pad_script_test
          ./pad_script_test
      - name: Probar el transporte experimental de GIF hacia PCSX2
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pcsx2_gif_bridge_test.cpp -o pcsx2_gif_bridge_test
          ./pcsx2_gif_bridge_test
      - name: Probar la lectura de matrices de camara sin el juego
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/camera_probe_test.cpp -o camera_probe_test
          ./camera_probe_test
      - name: Probar espejo de registros privilegiados PS2
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pcsx2_privileged_mirror_test.cpp -o pcsx2_privileged_mirror_test
          ./pcsx2_privileged_mirror_test
      - name: Probar cola ordenada y acotada del consumidor GS
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pthread tests/pcsx2_queue_test.cpp -o pcsx2_queue_test
          ./pcsx2_queue_test
      - name: Probar muestreo de intro y lectura de modelos sin el juego
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/model_probe_test.cpp -o model_probe_test
          ./model_probe_test
      - name: Probar lectura de salida skinning, scratchpad y retornos
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/skin_probe_test.cpp -o skin_probe_test
          ./skin_probe_test

  pcsx2_bridge:
    name: Conexion experimental GIF con headers reales de PCSX2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PCSX2/pcsx2
          ref: 2954ebe6965669219f1bbd256e958fbd8f83a85d
          path: pcsx2-reference
          sparse-checkout: |
            common
            pcsx2
            3rdparty/fmt
      - name: Compilar la conexion contra GSState y GSRenderer reales
        run: |
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_gif_sink_syntax.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_gif_parser_probe.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_privileged_layout_syntax.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include

  pcsx2_native:
    name: Modulo GS aislado Windows (enlace y parser, sin GPU)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PCSX2/pcsx2
          ref: 2954ebe6965669219f1bbd256e958fbd8f83a85d
          path: pcsx2-reference
          sparse-checkout: |
            common
            pcsx2
            3rdparty
            bin/resources/shaders
      - uses: actions/checkout@v5
        with:
          repository: microsoft/DirectX-Headers
          ref: 64c650b0c6642ab0f3cdf674e38401e02ccd2460
          path: directx-headers
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg-reference
      - uses: actions/cache@v4
        with:
          path: vcpkg-reference/installed
          key: windows-vcpkg-e456309-libpng-x64-static-md
      - name: Preparar libpng y zlib estaticas, sin DLL privada
        shell: pwsh
        run: |
          ./vcpkg-reference/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./vcpkg-reference/vcpkg.exe install libpng:x64-windows-static-md --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extraer dependencias de la revision fijada, sin el juego
        run: python tools/render/pcsx2_probe/prepare.py --pcsx2-source pcsx2-reference --output pcsx2-generated
      - name: Preparar cabeceras del runtime para comprobar el cliente Windows
        shell: pwsh
        run: |
          $revision = [regex]::Match((Get-Content scripts/common.ps1 -Raw), "PS2RecompCommit\s*=\s*'([0-9a-f]{40})'").Groups[1].Value
          if (-not $revision) { throw 'Commit del runtime no encontrado' }
          git init -q runtime-client-headers
          git -C runtime-client-headers fetch -q --depth 1 https://github.com/ran-j/PS2Recomp.git $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C runtime-client-headers checkout -q FETCH_HEAD
          foreach ($patch in (python tools/ci/parches.py)) {
            git -C runtime-client-headers apply --ignore-whitespace $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compilar modulo y fixtures; ejecutar parser y memoria, sin dispositivo
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /utf-8 /Zs /I runtime-client-headers/ps2xRuntime/include tests/pcsx2_runtime_client_syntax.cpp
          if errorlevel 1 exit /b 1
          cmake -S tools/render/pcsx2_probe -B pcsx2-probe-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPCSX2_SOURCE="%CD%/pcsx2-reference" -DPROBE_GENERATED="%CD%/pcsx2-generated" -DDIRECTX_HEADERS="%CD%/directx-headers" -DCMAKE_TOOLCHAIN_FILE="%CD%/vcpkg-reference/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DGOW_RUNTIME_HEADERS="%CD%/runtime-client-headers/ps2xRuntime/include"
          if errorlevel 1 exit /b 1
          cmake --build pcsx2-probe-build --parallel 3
          if errorlevel 1 exit /b 1
          ctest --test-dir pcsx2-probe-build --output-on-failure
          if errorlevel 1 exit /b 1

  runtime:
    name: Parches y suite del runtime (PS2Recomp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: gow

      # El commit fijado vive en scripts/common.ps1, igual que en la compilacion de Windows
      - name: Leer el commit fijado de PS2Recomp
        id: ps2recomp
        run: |
          commit=$(grep -oP "PS2RecompCommit\s*=\s*'\K[0-9a-f]{40}" gow/scripts/common.ps1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "PS2Recomp @ $commit"

      - name: Descargar PS2Recomp
        run: |
          git init -q PS2Recomp
          git -C PS2Recomp fetch -q --depth 1 https://github.com/ran-j/PS2Recomp.git ${{ steps.ps2recomp.outputs.commit }}
          git -C PS2Recomp checkout -q FETCH_HEAD

      # Mismos parches, orden y opciones que scripts/compilar.ps1 (tools/ci/parches.py los lee de ahi)
      - name: Aplicar los parches
        working-directory: PS2Recomp
        run: |
          parches=$(python3 ../gow/tools/ci/parches.py)
          for p in $parches; do
            echo "::group::$(basename "$p")"
            git apply --ignore-whitespace --verbose "$p"
            echo "::endgroup::"
          done

      # Con el runtime ya parcheado: cada stub de recomp.template.toml debe tener handler
      - name: Comprobar los handlers de los stubs
        run: python3 gow/tools/ci/validar_config.py --runtime PS2Recomp

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      # -march=x86-64-v2: el runtime usa intrinsecos SSE4.1 que GCC solo acepta con ese objetivo
      - name: Compilar ps2x_tests y los controles de FINISH y VU1
        working-directory: PS2Recomp
        run: |
          cat >> CMakeLists.txt <<'CMAKE'

          include("${CMAKE_SOURCE_DIR}/../gow/tools/ci/pruebas_gs.cmake")
          include("${CMAKE_SOURCE_DIR}/../gow/tools/ci/pruebas_vu1.cmake")
          CMAKE
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2X_BUILD_STUDIO=OFF \
            -DCMAKE_C_FLAGS=-march=x86-64-v2 -DCMAKE_CXX_FLAGS=-march=x86-64-v2
          ninja -C build ps2x_tests gow_gs_finish_async_test gow_vu1_compiled_test gow_vu1_fmac_test

      # src/gow_overrides.cpp solo se compila de verdad junto al codigo generado del juego (Windows). Aqui se
      # comprueba contra las cabeceras del runtime ya parcheado, declarando las sub_* que usa.
      - name: Compilar src/ contra el runtime parcheado
        run: |
          mkdir -p generado
          {
            echo '#pragma once'
            echo '#include "ps2_runtime.h"'
            grep -ho 'sub_[0-9A-F]\{8\}_0x[0-9a-f]\+' gow/src/*.cpp | sort -u |
              sed 's/.*/void &(uint8_t *rdram, R5900Context *ctx, PS2Runtime *runtime);/'
          } > generado/ps2_recompiled_functions.h
          for f in gow/src/*.cpp; do
            echo "$f"
            g++ -std=c++20 -march=x86-64-v2 -fsyntax-only \
              -IPS2Recomp/ps2xRuntime/include -IPS2Recomp/ps2xRuntime/src/lib -IPS2Recomp/ps2xIOP/include \
              -IPS2Recomp/build/_deps/raylib-src/src -Igenerado -Igow/src "$f"
          done

      - name: Probar el generador VU1 y los pares compilados con microcodigo procedural
        run: python3 gow/tests/vu1_compiled_cli_test.py PS2Recomp/build/gow_vu1_compiled_test

      - name: Probar FINISH default y opcional con lecturas sincronizadas
        run: |
          timeout 30 PS2Recomp/build/gow_gs_finish_async_test default
          timeout 30 PS2Recomp/build/gow_gs_finish_async_test async

      - name: Probar todas las FMAC de VU1 compiladas frente al interprete con valores limite
        # GOW-Port: la VU1 nativa va primero en el runtime de Waffle565; se apaga para comparar la compilada.
        run: GOW_VU1_NATIVE_OFF=1 PS2Recomp/build/gow_vu1_fmac_test 200

      - name: Ejecutar la suite
        working-directory: PS2Recomp
        run: |
          set +e
          timeout 1200 ./build/ps2xTest/ps2x_tests 2> ../ps2x_tests.err | python3 ../gow/tools/ci/comprobar_pruebas.py ../gow/tests/fallos_conocidos.txt
          estado=${PIPESTATUS[1]}
          if [ "$estado" -ne 0 ]; then
            echo "::group::stderr de la suite (ultimas 200 lineas)"
            tail -n 200 ../ps2x_tests.err
            echo "::endgroup::"
          fi
          exit "$estado"
