# Datos del mapa de estado (docs/estado/mapa.*.svg y docs/estado/detalle.*.md).
# Tras editar este archivo, regenera con:  python tools/estado/generar.py
# (La accion de GitHub "Mapa de estado" lo hace sola al subir cambios a main.)
#
# Estados: "ok" (funciona), "parcial" (funciona con fallos o sin verificar), "pendiente" (no funciona / no emulado).

# ---------------------------------------------------------------------------------------------------------
# Panel 1: librerias estaticas del SDK de Sony enlazadas en SCUS_973.99.
# Cada funcion de config/funcmap.csv entre `desde` y `hasta` es una celda. Una libreria empieza en `inicio`
# y llega hasta el inicio de la siguiente (el enlazador las coloca seguidas). Los inicios salen de las
# funciones con nombre de config/recomp.template.toml. Varias entradas con el mismo `nombre` se juntan.
# ---------------------------------------------------------------------------------------------------------
